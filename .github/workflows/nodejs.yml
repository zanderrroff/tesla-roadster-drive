name: Build game
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-model.mjs
      - run: node --experimental-strip-types scripts/check-controls.mjs
      - run: node --experimental-strip-types scripts/check-physics.mjs
      - run: node --experimental-strip-types scripts/check-motion.mjs
