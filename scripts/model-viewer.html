<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><style>body{margin:0;background:#27343e;color:white;font:14px Arial}header{padding:16px;display:flex;gap:20px}button{padding:10px}#views{display:flex}canvas{width:33.333%;height:65vh}label{display:inline-block;width:33%;text-align:center}</style></head><body><header>Model QA: original / mobile / high <button id="front">Front ¾</button><button id="back">Rear ¾</button><button id="side">Side</button></header><label>Original model</label><label>Mobile</label><label>High</label><div id="views"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader';
const pairs=[];for(const [url,optimized]of [['/.model-source/scene.gltf',false],['/models/roadster-mobile.glb',true],['/models/roadster-high.glb',true]]){const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth/3,innerHeight*.65);r.outputEncoding=T.sRGBEncoding;document.querySelector('#views').append(r.domElement);const s=new T.Scene();s.background=new T.Color('#27343e');s.add(new T.HemisphereLight(0xffffff,0x443322,1));const l=new T.DirectionalLight(0xffffff,1);l.position.set(3,5,5);s.add(l);const c=new T.PerspectiveCamera(40,(innerWidth/3)/(innerHeight*.65),.1,100);c.position.set(5,2.8,5);c.lookAt(0,.5,0);const g=await new GLTFLoader().loadAsync(url);if(optimized){g.scene.getObjectByName('Chassis').position.y=.58;const d=await fetch('/src/vehicle-dimensions.json').then(x=>x.json());for(let i=0;i<4;i++){const v=d.centers[i];g.scene.getObjectByName('Wheel_'+i).position.set(v[0],v[1]+.58,v[2]);}}s.add(g.scene);pairs.push([r,s,c]);r.render(s,c)}for(const [id,p] of [['front',[5,2.8,5]],['back',[-5,2.8,-5]],['side',[7.6,1.2,0]]])document.getElementById(id).onclick=()=>{for(const[r,s,c]of pairs){c.position.set(...p);c.lookAt(0,.5,0);r.render(s,c)}};
</script></body></html>
